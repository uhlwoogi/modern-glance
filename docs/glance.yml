# --- Edit access ---
# /edit is locked down by default. Pick ONE of the two blocks below.
#
# Option A (recommended): require login.
#   Generate values with:
#     go run . secret:make
#     go run . password:hash <your-password>
#
# auth:
#   secret-key: <paste base64 secret here>
#   users:
#     yourname:
#       password-hash: <paste bcrypt hash here>
#
# Option B: open /edit without authentication. ONLY on a trusted network —
# anyone who can reach this server can rewrite your config.
# (The config key is still named `admin` for backward compatibility.)
#
admin:
    allow-without-auth: true
pages:
    - name: Home
      # Optionally, if you only have a single page you can hide the desktop navigation for a cleaner look
      # hide-desktop-navigation: true
      columns:
        - size: small
          widgets:
            - type: calendar
              first-day-of-week: monday
            - type: rss
              limit: 10
              collapse-after: 3
              cache: 12h
              feeds:
                - url: https://www.techmeme.com/feed.xml
                  title: TechMeme
            - type: server-stats
        - size: full
          widgets:
            - type: group
              widgets:
                - type: hacker-news
            - type: videos
              channels:
                - UCXuqSBlHAE6Xw-yeJA0Tunw # Linus Tech Tips
                - UCR-DXc1voovS8nhAvccRZhg # Jeff Geerling
                - UCsBjURrPoezykLs9EqgamOA # Fireship
                - UCBJycsmduvYEL83R_U4JriQ # Marques Brownlee
                - UCHnyfMqiRRG1u-2MsSQLbXA # Veritasium
            - type: group
              widgets:
                - type: reddit
                  subreddit: technology
                  show-thumbnails: true
                - type: reddit
                  subreddit: selfhosted
                  show-thumbnails: true
        - size: small
          widgets:
            - type: weather
              location: Houston, US
              units: imperial
              hour-format: 12h
              # Optionally hide the location from being displayed in the widget
              # hide-location: true

              hide-location: true
              show-area-name: false
            - type: markets
              markets:
                - symbol: AMZN
                  name: Amazon.com, Inc.

